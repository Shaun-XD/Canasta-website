# Railway deploys the FastAPI + Socket.IO + game bridge (WebSockets).
# Vercel cannot host this process — see docs/DEPLOY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
